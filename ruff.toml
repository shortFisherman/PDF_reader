target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]

[lint.per-file-ignores]
"src/pdf_reader/app.py" = ["ANN201"]
"src/pdf_reader/routes.py" = ["ANN201", "ANN001", "ANN202"]
"tests/*.py" = ["ANN001", "ANN201"]
"tests/conftest.py" = ["ANN001", "ANN201"]
"src/pdf_reader/state.py" = ["ANN001"]
"src/pdf_reader/config.py" = ["ANN201"]
"src/pdf_reader/debug_trace.py" = ["ANN001", "ANN201", "ANN202", "ANN003"]
"tests/test_debug_trace.py" = ["ANN002", "ANN003", "ANN202"]
