name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest
    name: Lint & Test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python dependencies
        run: pip install -r requirements.lock

      - name: Install local package (editable)
        run: pip install -e . --no-deps

      - name: Smoke-test Python dependencies
        run: python -c "import flask, pymupdf, pdf2zh_next, pdf_reader"

      - name: Install frontend test dependencies
        run: npm ci

      - name: Verify repository
        shell: powershell
        run: ./scripts/verify.ps1
        env:
          PDF_READER_COVERAGE_ARTIFACT_DIR: coverage-artifacts

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage-artifacts/
          if-no-files-found: error
