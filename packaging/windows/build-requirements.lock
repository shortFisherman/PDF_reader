#
# Windows 便携发行构建工具锁。
#
# 安装目标只有 build/release-windows/venv（专用、可删除）；这些包不会进入发行物，也不
# 安装到仓库根 venv/。发行物内的运行时依赖由 runtime-requirements.lock 决定。
#
# 每个条目都带 SHA-256，build.ps1 用 PEP 503 的 `--require-hashes` 安装，因此构建工具
# 同样不能以浮动 URL 或未校验的包进入构建：pip 会在下载后校验摘要，不匹配即失败。
#
# 更新方式（Windows 构建机，Python 3.12）：
#   py -3.12 -m pip download --no-deps --only-binary=:all: --platform win_amd64 `
#       --python-version 3.12 --implementation cp --abi cp312 -d .cache pyinstaller==<版本>
#   py -3.12 -m pip hash .cache/*.whl
# 把版本与摘要写回本文件。PyInstaller 及其 hooks 包的版本升级必须与 runtime_policy 的
# Python 3.12 基线保持一致；发行物内的依赖清单仍以 runtime-requirements.lock 为唯一来源。
#
