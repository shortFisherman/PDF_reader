<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 双语阅读器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="file-input-area">
    <h2>打开 PDF 文档</h2>
    <input type="text" id="pdf-path" placeholder="C:\path\to\document.pdf">
    <button id="open-btn">Open</button>
</div>

<div id="app" class="hidden">
    <div class="column" id="left-column"></div>
    <div class="column" id="right-column"></div>
</div>

<div id="toolbar" class="hidden">
    <span class="page-indicator" id="page-indicator">Page --</span>
    <button id="translate-btn">Translate</button>
    <button id="toolbar-toggle" type="button" title="展开更多功能">▶</button>
    <div id="toolbar-extras" class="collapsed">
        <span id="zoom-level">100%</span>
        <button id="zoom-reset">重置缩放</button>
        <button id="prompt-toggle">+P</button>
        <input type="text" id="prompt-input" placeholder="Custom prompt..." style="display:none">
        <div id="batch-range-group">
            <label for="from-page">起</label>
            <input type="number" id="from-page" min="1" step="1">
            <label for="to-page">止</label>
            <input type="number" id="to-page" min="1" step="1">
        </div>
        <button id="range-translate-btn" type="button">范围</button>
        <button id="full-translate-btn" type="button">全文</button>
        <div id="progress-bar"><div id="progress-track"><div id="progress-fill"></div></div><span id="progress-status-text"></span></div>
    </div>
</div>

<script type="module" src="/static/app.js"></script>

</body>
</html>
