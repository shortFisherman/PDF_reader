[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf_reader"
version = "1.0.0"
description = "本地双语 PDF 翻译阅读器"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "pymupdf==1.25.2",
    "pdf2zh-next==2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_reader = []
