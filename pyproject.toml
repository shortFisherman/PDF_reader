[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf_reader"
version = "1.0.0"
description = "本地双语 PDF 翻译阅读器"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "pymupdf==1.25.2",
    "pdf2zh-next==2.9.0",
    "tomlkit==0.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.5",
    "coverage>=7.6",
    "mypy>=1.11",
    "pip-tools==7.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_reader = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests without external services or disk documents",
    "integration: tests exercising real Flask routes/AppState/disk boundaries",
    "system: system-level red-line regressions covering concurrency and failure paths",
]

[tool.coverage.run]
branch = true
source = ["pdf_reader"]

[tool.mypy]
python_version = "3.12"
files = ["src/pdf_reader"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pdf2zh_next",
    "pdf2zh_next.*",
    "pymupdf",
    "babeldoc.*",
]
ignore_missing_imports = true
