# =============================================================================
# PDF 阅读器 — 配置文件模板
# =============================================================================
# 使用方式：
#   1. 复制此文件为 config.toml：  cp config.example.toml config.toml
#   2. 编辑 config.toml 填入你的实际配置
#   3. config.toml 已被 .gitignore 忽略，不会提交到 git
#
# API Key 配置方式（二选一）：
#   方式 A（推荐）：设置环境变量 MODEL_API_KEY
#       PowerShell:  $env:MODEL_API_KEY = "sk-你的密钥"
#       CMD:          set MODEL_API_KEY=sk-你的密钥
#   方式 B：直接在下方的 api_key 字段填写
#       ⚠️ 注意不要将含真实 API Key 的 config.toml 提交到 git
#
# 支持的 provider 及高级参数（不支持的参数自动忽略）：
#   ┌────────────────────┬──────────────────────────────────────────────┐
#   │ provider           │ 高级参数（可选值）                            │
#   ├────────────────────┼──────────────────────────────────────────────┤
#   │ deepseek           │ thinking_mode(enabled/disabled),             │
#   │                    │ reasoning_effort(high/max)                   │
#   │ zhipu              │ enable_json_mode(true/false)                 │
#   │ siliconflow        │ enable_json_mode(true/false)                 │
#   │ aliyun             │ temperature(0~2), timeout(秒数),              │
#   │                    │ enable_json_mode(true/false)                 │
#   │ gemini             │ enable_json_mode(true/false)                 │
#   │ groq               │ enable_json_mode(true/false)                 │
#   │ grok               │ enable_json_mode(true/false)                 │
#   │ modelscope         │ enable_json_mode(true/false)                 │
#   │ openai             │ temperature(0~2), timeout(秒数),              │
#   │                    │ reasoning_effort(high/max),                  │
#   │                    │ enable_json_mode(true/false)                 │
#   │ openai_compatible  │ temperature(0~2), timeout(秒数),              │
#   │                    │ reasoning_effort(high/max),                  │
#   │                    │ enable_json_mode(true/false)                 │
#   └────────────────────┴──────────────────────────────────────────────┘
#   未列出的 provider 名自动走 openai_compatible 兜底（OpenAI 兼容接口）
# =============================================================================

# -----------------------------------------------------------------------------
# PDF 阅读器设置
# -----------------------------------------------------------------------------
[pdf_reader]
# 页面渲染 DPI（越高越清晰，但图片越大）
dpi = 200
# 翻译缓存目录（保存 right.pdf 等中间文件）
cache_dir = "cache"

# -----------------------------------------------------------------------------
# 模型配置（翻译服务使用的 LLM 模型）
# -----------------------------------------------------------------------------
[model]
# 模型供应商（必填）
#   可选值：deepseek / zhipu / siliconflow / aliyun / gemini / groq / grok
#          modelscope / openai / openai_compatible
provider = "deepseek"

# API Key（必填）
#   - 也可通过环境变量 MODEL_API_KEY 设置（优先级更高）
api_key = "sk-your-api-key-here"

# 模型名称（必填）
model = "deepseek-v4-flash"

# API 基础地址（可选，留空则使用引擎内置默认值）
#   - 仅 siliconflow / aliyun / openai / openai_compatible 支持自定义
#   - 其余引擎（deepseek / zhipu / gemini 等）使用内置官方地址
base_url = "https://api.deepseek.com/v1"

# -----------------------------------------------------------------------------
# 高级参数（全部可选）
# -----------------------------------------------------------------------------
# 仅在对应引擎支持时生效，不支持的引擎自动忽略并输出 warning
#
# thinking_mode = "enabled"
#   引擎: deepseek
#   可选值: "enabled"（开启深度思考）/ "disabled"（关闭）
#
# reasoning_effort = "high"
#   引擎: deepseek / openai / openai_compatible
#   可选值: "high"（高推理深度）/ "max"（最大推理深度）
#   前置: deepseek 引擎需同时设置 thinking_mode = "enabled"
#
# enable_json_mode = true
#   引擎: deepseek / zhipu / siliconflow / gemini / groq / grok /
#         modelscope / openai / aliyun / openai_compatible
#   可选值: true（强制 JSON 输出）/ false（关闭）
#
# temperature = "0.7"
#   引擎: openai / aliyun / openai_compatible
#   可选值: 0~2 之间的浮点数（控制输出随机性）
#
# timeout = "500"
#   引擎: openai / aliyun / openai_compatible
#   可选值: 正整数（请求超时秒数）

# -----------------------------------------------------------------------------
# 翻译设置
# -----------------------------------------------------------------------------
[translation]
# 源语言（ISO 639-1 代码）
lang_in = "en"
# 目标语言（ISO 639-1 代码）
lang_out = "zh"
# 每秒最大翻译请求数（避免触发 API 限流）
qps = 4

# -----------------------------------------------------------------------------
# 服务器设置
# -----------------------------------------------------------------------------
[server]
# 监听地址（127.0.0.1 = 仅本机访问，0.0.0.0 = 局域网内可访问）
host = "127.0.0.1"
# 监听端口
port = 5000
# 调试模式（开发时开启，生产环境关闭）
debug = true
