# =============================================================================
# PDF 阅读器 — 配置文件模板
# =============================================================================
# 使用方式：
#   1. 复制此文件为 config.toml：  cp config.example.toml config.toml
#   2. 编辑 config.toml 填入你的实际配置
#   3. config.toml 已被 .gitignore 忽略，不会提交到 git
#
# API Key 配置方式（二选一）：
#   方式 A（推荐）：设置环境变量 DEEPSEEK_API_KEY
#       PowerShell:  $env:DEEPSEEK_API_KEY = "sk-你的密钥"
#       CMD:          set DEEPSEEK_API_KEY=sk-你的密钥
#   方式 B：直接在下方的 api_key 字段填写
#       ⚠️ 注意不要将含真实 API Key 的 config.toml 提交到 git
# =============================================================================

# -----------------------------------------------------------------------------
# PDF 阅读器设置
# -----------------------------------------------------------------------------
[pdf_reader]
# 页面渲染 DPI（越高越清晰，但图片越大）
dpi = 200
# 翻译缓存目录（保存 right.pdf 等中间文件）
cache_dir = "cache"

# -----------------------------------------------------------------------------
# 模型配置（翻译服务使用的 LLM 模型）
# -----------------------------------------------------------------------------
[deepseek]
# DeepSeek API Key
#   - 从 https://platform.deepseek.com/api_keys 获取
#   - 也可通过环境变量 DEEPSEEK_API_KEY 设置（优先级更高）
api_key = "sk-your-api-key-here"

# 模型名称
#   - 可选模型：deepseek-chat, deepseek-v4-flash, deepseek-reasoner 等
#   - 查看完整列表：https://platform.deepseek.com/api-docs
model = "deepseek-v4-flash"

# API 基础地址
#   - 官方地址：https://api.deepseek.com/v1
#   - 如使用代理 / 兼容接口，可改为自定义地址
base_url = "https://api.deepseek.com/v1"

# -----------------------------------------------------------------------------
# 翻译设置
# -----------------------------------------------------------------------------
[translation]
# 源语言（ISO 639-1 代码）
lang_in = "en"
# 目标语言（ISO 639-1 代码）
lang_out = "zh"
# 每秒最大翻译请求数（避免触发 API 限流）
qps = 4

# -----------------------------------------------------------------------------
# 服务器设置
# -----------------------------------------------------------------------------
[server]
# 监听地址（127.0.0.1 = 仅本机访问，0.0.0.0 = 局域网内可访问）
host = "127.0.0.1"
# 监听端口
port = 5000
# 调试模式（开发时开启，生产环境关闭）
debug = true
